<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해양환경 MBTI — 나는 바다에서 어떤 생물일까</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --surface:#8FD4D8;
    --shallow:#2E8E9E;
    --mid:#125565;
    --deep:#07303E;
    --abyss:#041D28;
    --foam:#EAF6F4;
    --sand:#F3E7CE;
    --buoy:#FFB03A;
    --kelp:#59C08A;
    --ink:#052430;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Gothic A1','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;
    color:var(--foam);
    background:var(--mid);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  #sea{
    position:fixed; inset:0; z-index:-2;
    background:linear-gradient(180deg,var(--surface) 0%,var(--shallow) 18%,var(--mid) 45%,var(--deep) 75%,var(--abyss) 100%);
    background-size:100% 560vh;
    background-position:0 0;
    transition:background-position 1.1s cubic-bezier(.4,0,.2,1);
  }
  #rays{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      linear-gradient(103deg,rgba(255,255,255,.14) 0 3%,transparent 3.1% 9%,rgba(255,255,255,.09) 9.1% 11%,transparent 11.1% 21%,rgba(255,255,255,.12) 21.1% 23.5%,transparent 23.6% 100%);
    opacity:.55; transition:opacity 1.1s ease;
  }
  .wrap{
    max-width:640px; margin:0 auto; padding:28px 20px 64px;
    min-height:100dvh; display:flex; flex-direction:column; justify-content:center;
  }
  .screen{display:none}
  .screen.on{display:block}

  /* ---------- 표지 ---------- */
  .cover-mark{font-size:52px; line-height:1; letter-spacing:-.06em; margin-bottom:22px}
  h1{
    font-family:'Jua',sans-serif; font-weight:400;
    font-size:clamp(38px,11vw,62px); line-height:1.08; letter-spacing:-.02em;
    text-shadow:0 3px 0 rgba(4,29,40,.22);
  }
  .lede{margin-top:18px; font-size:17px; line-height:1.75; max-width:30em; color:rgba(234,246,244,.86)}
  .facts{
    margin-top:26px; display:flex; gap:10px; flex-wrap:wrap;
  }
  .fact{
    font-size:13px; padding:7px 13px; border-radius:999px;
    background:rgba(4,29,40,.28); border:1px solid rgba(234,246,244,.22);
  }

  /* ---------- 버튼 ---------- */
  .btn{
    font-family:inherit; font-size:17px; font-weight:800; color:var(--ink);
    background:var(--buoy); border:none; border-radius:16px;
    padding:17px 26px; cursor:pointer; width:100%;
    box-shadow:0 5px 0 #C9832A;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 #C9832A}
  .btn.ghost{
    background:transparent; color:var(--foam); box-shadow:none;
    border:1.5px solid rgba(234,246,244,.45); font-weight:600; font-size:15px; padding:14px;
  }
  .btn.ghost:active{transform:none; background:rgba(234,246,244,.1)}
  .btn-row{margin-top:34px; display:flex; flex-direction:column; gap:10px}
  button:focus-visible,.choice:focus-visible{outline:3px solid var(--kelp); outline-offset:3px}

  /* ---------- 수심계 ---------- */
  .gauge{display:flex; align-items:baseline; gap:10px; margin-bottom:8px}
  .depth{font-family:'Jua',sans-serif; font-size:30px; line-height:1}
  .gauge small{font-size:13px; color:rgba(234,246,244,.7)}
  .bar{height:5px; border-radius:3px; background:rgba(4,29,40,.35); overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:var(--kelp); transition:width .4s ease}

  /* ---------- 문항 ---------- */
  .qnum{margin-top:40px; font-size:14px; color:rgba(234,246,244,.7)}
  .qtext{
    font-family:'Jua',sans-serif; font-size:clamp(25px,6.6vw,34px);
    line-height:1.35; margin-top:10px; letter-spacing:-.01em;
  }
  .choices{margin-top:30px; display:flex; flex-direction:column; gap:12px}
  .choice{
    font-family:inherit; text-align:left; font-size:16.5px; line-height:1.6; color:var(--ink);
    background:var(--foam); border:none; border-radius:18px; padding:20px 22px;
    cursor:pointer; display:flex; gap:14px; align-items:flex-start;
    box-shadow:0 4px 0 rgba(4,29,40,.3);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .choice:hover{background:#fff}
  .choice:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(4,29,40,.3)}
  .choice b{
    font-family:'Jua',sans-serif; font-weight:400; font-size:17px;
    color:var(--shallow); flex:none; margin-top:1px;
  }
  .back{
    margin-top:22px; background:none; border:none; color:rgba(234,246,244,.7);
    font-family:inherit; font-size:14px; cursor:pointer; padding:6px 0;
  }
  .back[hidden]{display:none}

  /* ---------- 결과 ---------- */
  .card{
    background:var(--foam); color:var(--ink); border-radius:26px;
    padding:34px 26px 30px; box-shadow:0 18px 40px rgba(4,29,40,.4);
  }
  .card-top{font-size:13px; font-weight:600; color:var(--shallow)}
  .emoji{font-size:74px; line-height:1; margin:14px 0 6px}
  .tname{font-family:'Jua',sans-serif; font-size:38px; line-height:1.15}
  .tkeys{margin-top:12px; display:flex; gap:7px; flex-wrap:wrap}
  .tkeys span{
    font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px;
    background:rgba(18,85,101,.1); color:var(--mid);
  }
  .tline{margin-top:20px; font-size:19px; font-weight:800; line-height:1.55}
  .tdesc{margin-top:10px; font-size:16px; line-height:1.75; color:#274C58}
  .mission{
    margin-top:24px; border-radius:18px; padding:20px;
    background:var(--sand); border:2px dashed rgba(18,85,101,.35);
  }
  .mission h3{font-family:'Jua',sans-serif; font-weight:400; font-size:17px; color:var(--mid)}
  .mission p{margin-top:7px; font-size:18px; font-weight:800; line-height:1.55}
  .tags{margin-top:20px; font-size:14px; font-weight:600; color:var(--shallow); line-height:1.9}

  .near{margin-top:26px}
  .near h4{font-size:13px; color:rgba(234,246,244,.72); margin-bottom:12px}
  .row{display:flex; align-items:center; gap:11px; margin-bottom:9px; font-size:14.5px}
  .row .rb{flex:1; height:8px; border-radius:4px; background:rgba(4,29,40,.3); overflow:hidden}
  .row .rb i{display:block; height:100%; background:var(--kelp)}
  .row .rn{width:22px; text-align:right; font-size:13px; color:rgba(234,246,244,.75)}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,24px);
    background:var(--ink); color:var(--foam); font-size:14.5px; font-weight:600;
    padding:13px 22px; border-radius:999px; white-space:nowrap;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s ease, visibility .3s;
  }
  .toast.on{transform:translate(-50%,0); opacity:1; visibility:visible}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important; animation:none!important}
  }
</style>
</head>
<body>
<div id="sea"></div><div id="rays"></div>

<div class="wrap">

  <!-- 표지 -->
  <section id="s-intro" class="screen on">
    <div class="cover-mark">🌊🐙🦭🐋</div>
    <h1>바다를 지키는<br>나의 방식은?</h1>
    <p class="lede">같은 바다를 봐도 사람마다 움직이는 방식이 다릅니다. 20개의 질문에 답하면 열 가지 바다 생물 중 나와 닮은 유형과, 오늘 바로 해볼 수 있는 미션 하나를 받게 됩니다.</p>
    <div class="facts">
      <div class="fact">20문항</div>
      <div class="fact">약 2분</div>
      <div class="fact">10가지 유형</div>
    </div>
    <div class="btn-row">
      <button class="btn" id="start">수면에서 출발하기</button>
    </div>
  </section>

  <!-- 문항 -->
  <section id="s-quiz" class="screen">
    <div class="gauge"><span class="depth" id="depth">0m</span><small id="qcount">20문항 중 1번</small></div>
    <div class="bar"><i id="barfill"></i></div>
    <p class="qnum" id="qnum">질문 1</p>
    <h2 class="qtext" id="qtext"></h2>
    <div class="choices">
      <button class="choice" id="cA"><b>A</b><span></span></button>
      <button class="choice" id="cB"><b>B</b><span></span></button>
    </div>
    <button class="back" id="back">← 이전 질문</button>
  </section>

  <!-- 결과 -->
  <section id="s-result" class="screen">
    <div class="card">
      <p class="card-top">나의 해양환경 MBTI</p>
      <div class="emoji" id="rEmoji"></div>
      <h2 class="tname" id="rName"></h2>
      <div class="tkeys" id="rKeys"></div>
      <p class="tline" id="rLine"></p>
      <p class="tdesc" id="rDesc"></p>
      <div class="mission">
        <h3>오늘의 미션</h3>
        <p id="rMission"></p>
      </div>
      <p class="tags" id="rTags"></p>
    </div>

    <div class="near">
      <h4>나와 가까운 다른 유형</h4>
      <div id="rNear"></div>
    </div>

    <div class="btn-row">
      <button class="btn" id="copy">결과 문구 복사하기</button>
      <button class="btn ghost" id="again">처음부터 다시 하기</button>
    </div>
  </section>

</div>

<div class="toast" id="toast">결과 문구를 복사했습니다</div>

<script>
const TYPES = {
  turtle:{e:"🐢",n:"꾸준한 거북이",k:["꾸준함","생활습관","실천"],
    line:"작은 행동을 가장 오래 이어가는 사람",
    d:"한 번에 크게 바꾸기보다 매일 할 수 있는 만큼을 반복합니다. 바다를 바꾸는 건 결국 오래 지속된 습관이라는 걸 아는 유형이에요.",
    m:"7일 동안 매일 일회용품 하나 줄이기"},
  dolphin:{e:"🐬",n:"알리는 돌고래",k:["소통","공유","참여"],
    line:"혼자보다 같이 할 때 힘이 나는 사람",
    d:"알게 된 것을 그냥 두지 않고 주변에 전합니다. 한 사람의 실천을 여러 사람의 실천으로 늘리는 유형이에요.",
    m:"친구 3명에게 해양환경 정보 공유하기"},
  octopus:{e:"🐙",n:"아이디어 문어",k:["창의성","아이디어","변화"],
    line:"환경 문제를 새로운 시각으로 바라보는 사람",
    d:"하던 방식을 그대로 따르기보다 더 나은 방법이 없는지 먼저 생각합니다. 익숙한 문제에서 새로운 답을 찾는 유형이에요.",
    m:"플라스틱을 줄일 수 있는 아이디어 3개 만들기"},
  whale:{e:"🐋",n:"미래를 보는 고래",k:["미래","지속가능성","장기적 사고"],
    line:"오늘의 선택을 10년 뒤 바다로 재보는 사람",
    d:"지금 당장의 결과보다 이 행동이 쌓였을 때를 봅니다. 멀리 보기 때문에 쉽게 흔들리지 않는 유형이에요.",
    m:"10년 후 바다에게 편지 쓰기"},
  crab:{e:"🦀",n:"꼼꼼한 게",k:["정확성","규칙","관리"],
    line:"제대로 하는 것이 중요한 사람",
    d:"대충 아는 채로 넘어가지 않고 정확한 방법을 확인합니다. 잘못된 실천이 오히려 문제가 된다는 걸 아는 유형이에요.",
    m:"집에서 나오는 플라스틱 5개의 올바른 분리배출 방법 조사하기"},
  seal:{e:"🦭",n:"행동하는 물개",k:["행동력","즉시 실천","적극성"],
    line:"고민하는 사이에 이미 움직이는 사람",
    d:"문제를 발견하면 누가 하기를 기다리지 않습니다. 가장 빨리 첫걸음을 떼는 유형이에요.",
    m:"오늘 주변에서 발견한 쓰레기 3개 올바르게 처리하기"},
  fish:{e:"🐠",n:"탐구하는 물고기",k:["호기심","조사","지식"],
    line:"원인을 알아야 움직이는 사람",
    d:"눈에 보이는 현상보다 그 뒤의 이유를 궁금해합니다. 아는 만큼 더 정확하게 실천하는 유형이에요.",
    m:"해양쓰레기가 바다로 유입되는 과정 조사하기"},
  shark:{e:"🦈",n:"이끄는 상어",k:["리더십","영향력","캠페인"],
    line:"사람들을 움직이게 만드는 사람",
    d:"내 실천에서 멈추지 않고 함께할 사람을 모읍니다. 개인의 행동을 캠페인으로 키우는 유형이에요.",
    m:"친구 3명과 함께 일주일 환경 실천 약속 만들기"},
  jelly:{e:"🪼",n:"유연한 해파리",k:["유연함","부담 없는 실천","즉흥성"],
    line:"상황에 맞게 가볍게 해내는 사람",
    d:"계획에 매이지 않고 지금 가능한 것을 합니다. 부담이 없어서 오히려 멈추지 않는 유형이에요.",
    m:"오늘 발견한 첫 번째 환경 실천 기회 바로 행동하기"},
  orca:{e:"🐳",n:"해결하는 범고래",k:["문제해결","계획","변화"],
    line:"문제를 끝까지 풀어내는 사람",
    d:"원인을 찾고 구체적인 해결책까지 세웁니다. 한 번 바꾸면 계속 유지되는 구조를 만드는 유형이에요.",
    m:"학교에서 실천할 수 있는 해양환경 개선 방법 1개 제안하기"}
};

const Q = [
 ["바닷가에서 쓰레기를 발견했다면?","내가 할 수 있는 만큼 바로 주워서 버린다","seal","주변 사람들에게도 같이 치우자고 이야기한다","dolphin"],
 ["해양쓰레기 문제를 해결한다면?","지금까지 없었던 새로운 방법을 생각한다","octopus","앞으로 몇 년 뒤까지 생각해서 해결 방법을 세운다","whale"],
 ["분리배출 방법이 헷갈리는 쓰레기가 생겼다.","정확한 분리배출 방법을 찾아본다","crab","일단 바로 처리할 수 있는 방법부터 찾아 행동한다","seal"],
 ["해양환경 영상을 봤다.","영상에 나온 문제의 원인과 자료를 더 찾아본다","fish","친구들에게 영상을 공유하고 이야기를 나눈다","dolphin"],
 ["환경보호를 실천할 기회가 생겼다.","그때그때 내가 할 수 있는 행동을 한다","jelly","문제의 원인을 분석하고 제대로 해결할 방법을 생각한다","orca"],
 ["일주일 동안 환경 실천을 해야 한다면?","매일 같은 행동을 꾸준히 실천한다","turtle","매일 다른 환경 실천 방법을 시도해본다","octopus"],
 ["친구가 분리배출을 잘못하고 있다.","올바른 방법을 알려주고 함께 실천한다","dolphin","정확한 분리배출 방법을 찾아서 알려준다","crab"],
 ["미세플라스틱에 관한 기사를 봤다.","앞으로 바다와 사람에게 어떤 영향을 줄지 생각한다","whale","미세플라스틱이 어디서 생기는지 조사한다","fish"],
 ["쓰레기를 발견했는데 주변에 쓰레기통이 없다.","내가 직접 주워서 처리할 방법을 찾는다","seal","지금 가능한 작은 행동부터 하고 상황에 맞게 처리한다","jelly"],
 ["학교에서 해양환경 캠페인을 만든다면?","친구들을 모아서 함께 참여하도록 한다","shark","학교 전체가 지속적으로 실천할 수 있는 계획을 만든다","orca"],
 ["환경을 위한 습관 하나를 고른다면?","매일 부담 없이 계속할 수 있는 습관을 고른다","turtle","지금보다 미래에 더 큰 도움이 되는 습관을 고른다","whale"],
 ["환경 캠페인에 참여하게 됐다.","캠페인 기간 내내 할 수 있는 작은 실천을 정해 꾸준히 이어간다","turtle","친구들을 모아 함께 참여하도록 이끈다","shark"],
 ["플라스틱 문제를 해결해야 한다면?","플라스틱을 대신할 새로운 아이디어를 생각한다","octopus","플라스틱 문제가 생기는 원인부터 조사한다","fish"],
 ["주변 사람들이 환경보호에 관심이 없다.","정확한 환경보호 방법과 정보를 알려준다","crab","사람들이 실제로 참여하도록 설득하고 이끈다","shark"],
 ["환경 실천 목표를 정한다면?","내가 할 수 있는 행동을 구체적인 계획으로 만든다","orca","상황에 따라 자유롭게 실천한다","jelly"],
 ["학교에서 바다를 보호하기 위한 활동을 한다면?","학교의 문제를 찾아 제도나 시스템을 바꾸는 방법을 제안한다","orca","내가 할 수 있는 작은 행동부터 꾸준히 한다","turtle"],
 ["새로운 해양환경 정보를 알게 됐다.","친구나 SNS에 알려서 더 많은 사람이 알게 한다","dolphin","출처를 확인하고 관련 정보를 더 찾아본다","fish"],
 ["바다를 보호하기 위해 하나를 선택한다면?","미래 세대까지 생각해서 장기적인 방법을 선택한다","whale","정확한 규칙과 방법을 지켜 실천한다","crab"],
 ["바닷가에서 환경 문제가 발생했다.","내가 먼저 행동해서 문제를 해결한다","seal","주변 사람들을 모아 함께 해결하도록 한다","shark"],
 ["새로운 해양환경 캠페인을 기획한다면?","사람들이 이전에 본 적 없는 독특한 방식으로 만든다","octopus","복잡하지 않고 누구나 쉽게 참여할 수 있게 만든다","jelly"]
];

const $ = id => document.getElementById(id);
let i = 0, picks = [];

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo(0,0);
}
function dive(step){ // 0~20
  const p = step/Q.length;
  $('sea').style.backgroundPosition = '0 ' + (-p*460) + 'vh';
  $('rays').style.opacity = Math.max(0,.55-p*.62);
}
function render(){
  const q = Q[i];
  $('qnum').textContent = '질문 ' + (i+1);
  $('qcount').textContent = '20문항 중 ' + (i+1) + '번';
  $('depth').textContent = (i*10) + 'm';
  $('barfill').style.width = (i/Q.length*100) + '%';
  $('qtext').textContent = q[0];
  $('cA').lastElementChild.textContent = q[1];
  $('cB').lastElementChild.textContent = q[3];
  $('back').hidden = i === 0;
  dive(i);
}
function pick(which){
  picks[i] = Q[i][which === 'A' ? 2 : 4];
  picks.length = i + 1;
  i++;
  if(i < Q.length) render(); else finish();
}
function finish(){
  dive(Q.length);
  const score = {}, first = {};
  Object.keys(TYPES).forEach(k => score[k] = 0);
  picks.forEach((t, idx) => { score[t]++; if(first[t] === undefined) first[t] = idx; });

  const ranked = Object.keys(score).sort((a,b) =>
    score[b] - score[a] || (first[a] ?? 99) - (first[b] ?? 99));
  const top = ranked[0], T = TYPES[top];

  $('rEmoji').textContent = T.e;
  $('rName').textContent = T.n;
  $('rKeys').innerHTML = T.k.map(x => '<span>' + x + '</span>').join('');
  $('rLine').textContent = '"' + T.line + '"';
  $('rDesc').textContent = T.d;
  $('rMission').textContent = T.m;
  $('rTags').textContent = '#해양환경MBTI #나는' + T.n.replace(/\s/g,'') + ' #바다를지켜요';

  $('rNear').innerHTML = ranked.slice(1,4).map(k =>
    '<div class="row"><span>' + TYPES[k].e + '</span><span>' + TYPES[k].n +
    '</span><span class="rb"><i style="width:' + (score[k]/4*100) + '%"></i></span>' +
    '<span class="rn">' + score[k] + '</span></div>').join('');

  window.shareText =
    '🌊 나의 해양환경 MBTI\n' + T.e + ' ' + T.n + '\n"' + T.line + '"\n\n' +
    T.d + '\n\n🌱 오늘의 미션\n' + T.m + '\n\n' + $('rTags').textContent;

  show('s-result');
}

$('start').onclick = () => { i = 0; picks = []; render(); show('s-quiz'); };
$('cA').onclick = () => pick('A');
$('cB').onclick = () => pick('B');
$('back').onclick = () => { if(i > 0){ i--; render(); } };
$('again').onclick = () => { i = 0; picks = []; dive(0); show('s-intro'); };
$('copy').onclick = async () => {
  try{ await navigator.clipboard.writeText(window.shareText); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = window.shareText; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  $('toast').classList.add('on');
  setTimeout(() => $('toast').classList.remove('on'), 1900);
};
dive(0);
</script>
</body>
</html>
